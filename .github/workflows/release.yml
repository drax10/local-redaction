name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build Release
        run: |
          xcodebuild \
            -scheme LocalRedaction \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath DerivedData \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_ALLOWED=YES \
            build

      - name: Zip app
        run: |
          APP="DerivedData/Build/Products/Release/LocalRedaction.app"
          ditto -c -k --keepParent "$APP" RedaccionLocal.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RedaccionLocal
          path: RedaccionLocal.zip

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: RedaccionLocal.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
