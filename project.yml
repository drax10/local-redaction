name: LocalRedaction
options:
  bundleIdPrefix: com.tapachtli
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: es
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ALWAYS_SEARCH_USER_PATHS: NO
    CLANG_ENABLE_MODULES: YES
    CLANG_ENABLE_OBJC_ARC: YES
    ENABLE_STRICT_OBJC_MSGSEND: YES
    GCC_NO_COMMON_BLOCKS: YES
    SWIFT_STRICT_CONCURRENCY: targeted
targets:
  LocalRedaction:
    type: application
    platform: macOS
    sources:
      - path: LocalRedaction
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tapachtli.LocalRedaction
        PRODUCT_NAME: LocalRedaction
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDevelopmentRegion: es
        INFOPLIST_KEY_CFBundleDisplayName: Redacción Local
        INFOPLIST_KEY_CFBundleName: Redacción Local
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 Tapachtli. Todos los derechos reservados."
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        INFOPLIST_KEY_LSMinimumSystemVersion: "14.0"
        CODE_SIGN_ENTITLEMENTS: LocalRedaction/Resources/LocalRedaction.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
    entitlements:
      path: LocalRedaction/Resources/LocalRedaction.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
schemes:
  LocalRedaction:
    build:
      targets:
        LocalRedaction: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
